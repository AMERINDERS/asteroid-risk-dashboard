<div class="shell" [class.nav-open]="navOpen()">
  <header class="topbar">
    <div class="topbar-start">
      <button class="hamburger-btn" (click)="navOpen.update(v => !v)" aria-label="Toggle navigation">
        <lucide-icon [img]="icons.Menu" size="20"></lucide-icon>
      </button>
      <a class="brand" routerLink="/">
        <span class="brand-mark"></span>
        <span class="brand-name">AsteroidRisk</span>
      </a>
    </div>
    <div class="topbar-meta">
      <span class="live-indicator">
        <span class="live-dot"></span>
        <span class="live-text">Live · updated 3 min ago</span>
      </span>
      <button class="icon-btn" aria-label="Settings">
        <lucide-icon [img]="icons.Settings" size="18"></lucide-icon>
      </button>
    </div>
  </header>

  <nav class="subnav" [class.open]="navOpen()">
    @for (item of navItems; track item.route) {
      <a
        [routerLink]="item.route"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: item.route === '/' }"
        class="subnav-item"
      >
        <lucide-icon [img]="item.icon" size="16"></lucide-icon>
        <span>{{ item.label }}</span>
        @if (item['badge']) {
          <span class="nav-badge">{{ item['badge'] }}</span>
        }
      </a>
    }
  </nav>

  <main class="content" [class.globe-view]="isGlobeView()">
    <router-outlet />
  </main>
</div>
