<div class="chart-card">
  <div class="chart-header">
    <h3 class="chart-title">Monthly Flyby History</h3>
    <span class="chart-sub">Bars = flyby count · Line = avg risk score</span>
  </div>
  <div class="chart-wrap">
    <canvas baseChart
      [data]="chartData"
      [options]="chartOptions"
      type="bar">
    </canvas>
  </div>
</div>
