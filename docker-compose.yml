# docker-compose.yml
services:

  db:
    image: postgres:16
    container_name: asteroid_postgres
    environment:
      POSTGRES_USER: asteroid
      POSTGRES_PASSWORD: asteroid
      POSTGRES_DB: asteroids
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asteroid"]
      interval: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: asteroid_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
